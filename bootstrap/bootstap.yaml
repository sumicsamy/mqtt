apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mqtt
  namespace: openshift-gitops
spec:
  description: Project to manage all fleet truck simulator Applications
  sourceRepos:
    - 'https://github.com/sumicsamy/mqtt.git'
    - 'https://charts.jetstack.io'
  destinations:
    - namespace: '*'
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: site-applications
  namespace: openshift-gitops
spec:
  generators:
    - git:
        repoURL: https://github.com/sumicsamy/mqtt.git
        revision: main
        directories:
          - path: "*/argo"
          - path: "*/*/argo"     
  template:
    metadata:
      name: '{{path[0]}}'
    spec:
      project: mqtt
      source:
        repoURL: https://github.com/sumicsamy/mqtt.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
