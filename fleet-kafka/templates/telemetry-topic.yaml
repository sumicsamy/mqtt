apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .Values.telemetryTopic.name }}
  namespace: {{ .Values.namespace }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.clusterName }}
spec:
  partitions: {{ .Values.telemetryTopic.partitions }}
  replicas: 3
  config:
    retention.ms: {{ .Values.telemetryTopic.retentionMs }}
