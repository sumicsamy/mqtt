apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mqtt-plugin-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mqtt-plugin-fetch
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: fetch-mqtt-plugin
        image: curlimages/curl:latest
        command:
          - sh
          - -c
          - |
            echo “Downloading MQTT connector jar…”;
            curl -L -o /mnt/plugin/kafka-connect-mqtt-assembly-10.0.3.jar \
              https://github.com/sumicsamy/mqtt/releases/download/v1.0.0/kafka-connect-mqtt-assembly-10.0.3.jar;
            echo “Download finished. Listing files…”;
            ls -l /mnt/plugin;
        volumeMounts:
          - name: plugin-volume
            mountPath: /mnt/plugin
      volumes:
        - name: plugin-volume
          persistentVolumeClaim:
            claimName: mqtt-plugin-pvc
  backoffLimit: 3
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: fleet-connect
  namespace: {{ .Values.namespace }}
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: "4.0.0"       # adjust to your Kafka version
  replicas: {{ .Values.connect.replicas }}
  bootstrapServers: "fleet-kafka-kafka-bootstrap:9092"
  tls:
    trustedCertificates:
      - secretName: fleet-root-trust
        pattern: '*.pem'
  resources:
    requests:
      cpu: {{ .Values.connect.resources.requests.cpu }}
      memory: {{ .Values.connect.resources.requests.memory }}
    limits:
      cpu: {{ .Values.connect.resources.limits.cpu }}
      memory: {{ .Values.connect.resources.limits.memory }}
  template:
    pod:
      volumes:
        - name: mqtt-plugin-volume
          persistentVolumeClaim:
            claimName: mqtt-plugin-pvc
        - name: certs-volume
          secret:
            secretName: {{ .Values.bridge.mqtt.clientId }}-tls    
    connectContainer:
      volumeMounts:
        - name: mqtt-plugin-volume
          mountPath: {{ .Values.connect.pluginPath }}
        - name: certs-volume
          mountPath: /certs  
          readOnly: true
  config:
    key.converter: {{ .Values.mqttConnector.kafka.keyConverter }}
    value.converter: {{ .Values.mqttConnector.kafka.valueConverter }}
    value.converter.schemas.enable: {{ .Values.mqttConnector.kafka.valueConverterSchemasEnable }}
    offset.storage.topic: connect-offsets
    config.storage.topic: connect-configs
    status.storage.topic: connect-status
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: {{ .Values.mqttConnector.name }}
  namespace: {{ .Release.Namespace }}
spec:
  class: io.lenses.streamreactor.connect.mqtt.source.MqttSourceConnector
  tasksMax: {{ .Values.mqttConnector.tasksMax }}
  config:
    connect.mqtt.hosts: "{{ .Values.mqttConnector.mqtt.brokers }}"
    connect.mqtt.topic: "{{ .Values.mqttConnector.mqtt.topicFilter }}"
    connect.mqtt.qos: "{{ .Values.mqttConnector.mqtt.qos }}"
    connect.mqtt.client.id: "{{ .Values.mqttConnector.mqtt.clientId }}"
    topics: "{{ .Values.mqttConnector.kafka.targetTopic }}"
    key.converter: "{{ .Values.mqttConnector.kafka.keyConverter }}"
    value.converter: "{{ .Values.mqttConnector.kafka.valueConverter }}"
    value.converter.schemas.enable: "{{ .Values.mqttConnector.kafka.valueConverterSchemasEnable }}"
    poll.interval.ms: "{{ .Values.mqttConnector.tuning.pollIntervalMs }}"
    producer.override.batch.size: "{{ .Values.mqttConnector.tuning.batchMaxSize }}"
    producer.override.linger.ms: "{{ .Values.mqttConnector.tuning.pollIntervalMs }}"
    connect.mqtt.ssl.ca.cert: /certs/ca.crt
    connect.mqtt.ssl.cert: /certs/tls.crt
    connect.mqtt.ssl.key: /certs/tls.key


