apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.bridge.mqtt.clientId }}-tls
  namespace: {{ .Values.namespace }}
spec:
  secretName: {{ .Values.bridge.mqtt.clientId }}-tls
  commonName: {{ .Values.bridge.mqtt.clientId }}.{{ .Values.namespace }}.svc.cluster.local
  usages: ["client auth"]
  issuerRef:
    name: fleet-issuer
    kind: ClusterIssuer