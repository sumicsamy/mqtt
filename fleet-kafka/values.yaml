# ============================================================
# Global Namespace
# ============================================================
namespace: fleet-kafka


# ============================================================
# Kafka Cluster (AMQ Streams)
# ============================================================
kafka:
  clusterName: fleet-kafka
  replicas: 3

  # Kafka version MUST match AMQ Streams operator support matrix
  kafkaVersion: 3.7.0

  # PVC size for each broker
  storageSize: 100Gi



# ============================================================
# Telemetry Topic (Incoming raw telemetry from 1700 trucks)
# ============================================================
telemetryTopic:
  name: truck-telemetry
  partitions: 48              # good for ~1M msg/sec
  replicationFactor: 3
  retentionMs: 86400000       # 1 day retention




# ============================================================
# MQTT→Kafka High-Performance Bridge (Go code)
# ============================================================
bridge:
  enabled: true

  image: "quay.io/suchugh/mqtt-kafka-bridge:2.0.12"
  replicas: 2          # scale horizontally for 1M/s
  workerCount: 64    # increase for higher throughput
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  # MQTT broker (Artemis)
  mqtt:
    brokers: " tls://mqtt-lb.mqtt-broker.svc.cluster.local:8883 "
    topic: "mine/fleet/+/truck/+/telemetry"
    qos: 1                    # recommended for 1M/s
    clientId: "mqtt-kafka-bridge"


  # Kafka side
  kafka:
    brokers: "fleet-kafka-kafka-bootstrap:9092"
    topic: "truck-telemetry"
    clientId: "mqtt-kafka-bridge"

  # Internal parameters
  prometheusPort: "8080"
  messageBuffer: 100000



# ============================================================
# Aggregator (Kafka → Prometheus metrics)
# ============================================================
aggregator:
  enabled: true

  image: "quay.io/suchugh/fleet-aggregator:2.0.4"
  replicas: 1
  port: 8081
  prometheusPath: "/metrics"

  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"



# ============================================================
# ServiceMonitor (Prometheus Operator / OpenShift UWM)
# ============================================================
serviceMonitor:
  enabled: true

  # Adjust this label to match your Prometheus installation
  labelSelector:
    release: "prometheus"
# ============================================================
# KAFKA EXPORTER
# ============================================================
kafkaExporter:
  enabled: true
  topicRegex: ".*"
  groupRegex: ".*"

# ============================================================
# Kafka Connect with MQTT Source Connector
# ============================================================
connect:
  extraPlugins:
    - name: mqtt-source-connector
      jars:
        - kafka-connect-mqtt-assembly-10.0.3.jar
  replicas: 1
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  pluginPath: /opt/kafka/plugins/

mqttConnector:
  name: mqtt-to-kafka-telemetry
  tasksMax: 8
  mqtt:
    brokers: "ssl://fleet-manager-broker-mqtts-0-svc.mqtt-broker.svc.cluster.local:8883"
    topicFilter: "mine/fleet/+/truck/+/telemetry"
    qos: 1
    clientId: mqtt-kafka-connect-bridge
  kafka:
    targetTopic: truck-telemetry
    keyConverter: org.apache.kafka.connect.storage.StringConverter
    valueConverter: org.apache.kafka.connect.json.JsonConverter
    valueConverterSchemasEnable: "false"
  tuning:
    pollIntervalMs: 100
    batchMaxSize: 1000
    bufferMemory: 33554432 

# ============================================================
# End of file
# ============================================================
