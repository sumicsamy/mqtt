# --------------------------------------------------------------------
#  Application Default Config
# --------------------------------------------------------------------
# These are the default values used if no Env Vars are present.
bridge.id=camel-mqtt-bridge-01
mqtt.broker.url=tcp://mqtt-broker:1883
mqtt.topic=mine/fleet/+/truck/+/#
kafka.brokers=my-cluster-kafka-bootstrap:9092
kafka.topic=truck-telemetry

# --------------------------------------------------------------------
#  OpenShift / Kubernetes Generation
# --------------------------------------------------------------------
quarkus.openshift.part-of=fleet-telemetry
quarkus.openshift.route.expose=false
quarkus.kubernetes-client.trust-certs=true

# CRITICAL FIX: Updated to Java 21 to match your pom.xml
# Using full registry URL to avoid "ImageStream not found" errors
#quarkus.package.jar.type=uber-jar
# --------------------------------------------------------------------
#  Environment Variables (Mapped to Deployment)
# --------------------------------------------------------------------
quarkus.openshift.env.vars.MQTT_BROKER_URL=tcp://mqtt-broker:1883
quarkus.openshift.env.vars.MQTT_TOPIC=mine/fleet/+/truck/+/#
quarkus.openshift.env.vars.KAFKA_BROKERS=my-cluster-kafka-bootstrap:9092
quarkus.openshift.env.vars.KAFKA_TOPIC=truck-telemetry
quarkus.openshift.env.vars.BRIDGE_ID=camel-mqtt-bridge-01

# --------------------------------------------------------------------
#  Quarkus & Metrics
# --------------------------------------------------------------------
quarkus.micrometer.export.prometheus.enabled=true
camel.health.enabled=true
