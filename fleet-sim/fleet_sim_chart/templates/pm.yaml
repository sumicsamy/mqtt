{{- range $site := .Values.sites }}
{{- if eq $.Values.platform "amq" }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fleet-sim-pod-monitor
  namespace: {{ $site.namespace }}
  labels:
    fleet_sim: "true"
spec:
  selector:
    matchLabels:
      fleet_sim: "true"
  podMetricsEndpoints:
  - path: /metrics
    port: http-metrics
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_label_app]
        targetLabel: app  
---
{{- else }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fleet-sim-pod-monitor
  namespace: {{ $site.namespace }}
  labels:
    fleet_sim: "true"
spec:
  selector:
    matchLabels:
      fleet_sim: "true"
  podMetricsEndpoints:
  - path: /metrics
    port: http-metrics
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_label_app]
        targetLabel: app    
{{- end }}
{{- end }}