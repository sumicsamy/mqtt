apiVersion: v1
kind: Namespace
metadata:
  name: fleet-metrics
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
---    
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-config
  namespace: fleet-metrics
data:
  telegraf.conf: |
    [agent]
      interval = "5s"
      flush_interval = "5s"
      hostname = "telegraf"

    [[inputs.mqtt_consumer]]
      servers = ["ssl://mqtt-lb.mqtt-broker.svc.cluster.local:8883"]
      topics  = ["mine/fleet/+/truck/+/telemetry"]
      qos = 1
      client_id = "telegraf-mqtt"
      insecure_skip_verify = true
      data_format = "json"      # built-in JSON parser (no v2 mapping)

    [[outputs.prometheus_client]]
      listen = ":9273"
      metric_version = 2

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  namespace: fleet-metrics
  labels:
    app: telegraf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf
  template:
    metadata:
      labels:
        app: telegraf
    spec:
      containers:
      - name: telegraf
        image: docker.io/library/telegraf:1.31
        imagePullPolicy: IfNotPresent
        ports:
          - name: metrics
            containerPort: 9273
        volumeMounts:
          - name: config
            mountPath: /etc/telegraf/telegraf.conf
            subPath: telegraf.conf
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: telegraf-config
---
apiVersion: v1
kind: Service
metadata:
  name: telegraf
  namespace: fleet-metrics
  labels:
    app: telegraf
spec:
  selector:
    app: telegraf
  ports:
    - name: metrics
      port: 9273
      targetPort: 9273
