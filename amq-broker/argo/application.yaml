apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amq-broker-operator
  namespace: openshift-gitops
spec:
  project: mqtt
  source:
    repoURL: 'https://github.com/sumicsamy/mqtt.git'
    targetRevision: main
    path: amq-broker/
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: amq-broker-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
