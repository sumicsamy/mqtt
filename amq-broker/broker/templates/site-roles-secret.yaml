apiVersion: v1
kind: Secret
metadata:
  name: site-roles-bp
  namespace: {{ .Values.brokerNamespace }}
type: Opaque
stringData:
  site-roles.properties: |
{{- range $site := .Values.sites }}
  {{- range $i, $v := until ($site.truckCount | int) }}
    securityRoles."mine.fleet.{{ $site.id }}.truck.{{ printf "%03d" $i }}.telemetry".truck-{{ $site.id }}-{{ printf "%03d" $i }}.send=true
    securityRoles."mine.fleet.{{ $site.id }}.truck.{{ printf "%03d" $i }}.telemetry".truck-{{ $site.id }}-{{ printf "%03d" $i }}.createAddress=
    securityRoles."mine.fleet.{{ $site.id }}.truck.{{ printf "%03d" $i }}.telemetry".mqtt-kafka-bridge.consume=true
    securityRoles."mine.fleet.{{ $site.id }}.truck.{{ printf "%03d" $i }}.telemetry".mqtt-kafka-bridge.createDurableQueue=true
    securityRoles."mine.fleet.{{ $site.id }}.truck.{{ printf "%03d" $i }}.telemetry".mqtt-kafka-bridge.deleteDurableQueue=true
    securityRoles."mine.fleet.{{ $site.id }}.truck.{{ printf "%03d" $i }}.telemetry".mqtt-kafka-bridge.browse=true
  {{- end }}
{{- end }}
    
