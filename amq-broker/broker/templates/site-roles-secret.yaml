apiVersion: v1
kind: Secret
metadata:
  name: site-roles-bp
  namespace: {{ .Values.brokerNamespace }}
type: Opaque
stringData:
  site-roles.properties: |
{{- range $site := .Values.sites }}
  {{- range $i, $v := until ($site.truckCount | int) }}
    securityRoles."mine.fleet.{{ $site.id }}.truck.{{ printf "%03d" $i }}.telemetry".truck-{{ $site.id }}-{{ printf "%03d" $i }}.send=true
    securityRoles."mine.fleet.{{ $site.id }}.truck.{{ printf "%03d" $i }}.telemetry".truck-{{ $site.id }}-{{ printf "%03d" $i }}.createAddress=true
  {{- end }}
{{- end }}
    securityRoles."mine.fleet.*.truck.*.telemetry".telegraf.consume=true
    securityRoles."mine.fleet.*.truck.*.telemetry".telegraf.createDurableQueue=true
    securityRoles."mine.fleet.*.truck.*.telemetry".telegraf.deleteDurableQueue=true
    securityRoles."mine.fleet.*.truck.*.telemetry".telegraf.browse=true
    # Allow MQTT-Kafka bridge consumption
    securityRoles."mine.fleet.*.truck.*.telemetry".mqtt-kafka-broker.consume=true
    securityRoles."mine.fleet.*.truck.*.telemetry".mqtt-kafka-broker.createDurableQueue=true
    securityRoles."mine.fleet.*.truck.*.telemetry".mqtt-kafka-broker.deleteDurableQueue=true
    securityRoles."mine.fleet.*.truck.*.telemetry".mqtt-kafka-broker.browse=true


