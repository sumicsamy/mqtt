---
# amq-broker-operator/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: mqtt-broker
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    inject-fleet-ca: enabled
---    
apiVersion: broker.amq.io/v1beta1
kind: ActiveMQArtemis
metadata:
  name: fleet-manager-broker
  namespace: mqtt-broker
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acceptors:
    - name: mqtts
      protocols: mqtt
      port: 8883
      sslEnabled: true
      wantClientAuth: true
      verifyHost: false
      sslSecret: amq-broker-tls
      trustSecret: fleet-root-trust
  brokerProperties:
    - "acceptorConfigurations.mqtts.params.sslAutoReload=true"
  deploymentPlan:
    size: 3
    persistenceEnabled: true
    journalType: nio
    enableMetricsPlugin: true
    extraMounts:
      secrets:
      - "amq-jaas-cert-login"
      - "site-roles"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: ActiveMQArtemis
                  operator: In
                  values:
                    - fleet-manager-broker
            topologyKey: kubernetes.io/hostname
  console:
    expose: true
  