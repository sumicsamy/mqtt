apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: root-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fleet-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: fleet-root-ca
  secretName: fleet-root-ca
  duration: 87600h
  issuerRef:
    name: root-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fleet-issuer
spec:
  ca:
    secretName: fleet-root-ca

