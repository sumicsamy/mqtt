apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-mqtt
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/sumicsamy/mqtt.git'
    targetRevision: main
    path: cert-manager/
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true