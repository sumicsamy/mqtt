apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trust-manager-secret-writer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trust-manager-secret-writer
subjects:
  - kind: ServiceAccount
    name: trust-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trust-manager-secret-writer
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: fleet-root-trust
spec:
  sources:
    - secret:
        key: ca.crt
        name: fleet-root-ca
  target:
    additionalFormats:
      jks:
        key: client.ts
        password: 'changeit'
    namespaceSelector:
      matchLabels:
        inject-fleet-ca: enabled
    secret:
      key: client-bundle-ca.pem
      metadata:
        annotations:
          argocd.argoproj.io/sync-wave: '1'
        labels:
          app.kubernetes.io/component: trust-bundle
---
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: fleet-trust-bundle
spec:
  sources:
    - secret:
        key: ca.crt
        name: fleet-root-ca
  target:
    additionalFormats:
      jks:
        key: client.ts
        password: 'changeit'
    namespaceSelector:
      matchLabels:
        inject-fleet-ca: enabled
    secret:
      key: client-bundle-ca.pem
      metadata:
        annotations:
          argocd.argoproj.io/sync-wave: '1'
        labels:
          app.kubernetes.io/component: trust-bundle          