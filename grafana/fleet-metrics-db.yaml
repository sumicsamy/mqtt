apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: truck-telemetry-overview
  namespace: grafana   # same as your datasource namespace
  labels:
    app: grafana
    dashboard: truck-telemetry
spec:
  # 👇 must match your Grafana instance labelSelector (use same as in datasource)
  instanceSelector:
    matchLabels:
      dashboards: fleet-metrics
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
          "type": "stat",
          "title": "Average Speed (km/h)",
          "targets": [
            {
              "expr": "avg(mqtt_consumer_spd{truck=\"$truck\", region=\"$region\"})",
              "legendFormat": "avg speed",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 }
        },
        {
          "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Truck Speed per Truck",
          "targets": [
            {
              "expr": "avg by(truck) (mqtt_consumer_spd{truck=\"$truck\", region=\"$region\"})",
              "legendFormat": "{{truck}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 7, "w": 18, "x": 6, "y": 0 }
        },
        {
          "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Engine Temperature (°C)",
          "targets": [
            {
              "expr": "mqtt_consumer_tmp{truck=\"$truck\", region=\"$region\"}",
              "legendFormat": "{{truck}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 7 }
        },
        {
          "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Engine RPM",
          "targets": [
            {
              "expr": "mqtt_consumer_rpm{truck=\"$truck\", region=\"$region\"}",
              "legendFormat": "{{truck}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 7 }
        },
        {
          "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Fuel Level (L)",
          "targets": [
            {
              "expr": "avg by(truck) (mqtt_consumer_fuel{region=\"$region\", truck=\"$truck\"})",
              "legendFormat": "{{truck}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 14 }
        },
        {
          "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Payload Weight (t)",
          "targets": [
            {
              "expr": "avg by(truck) (mqtt_consumer_pay_t{region=\"$region\", truck=\"$truck\"})",
              "legendFormat": "{{truck}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 14 }
        },
        {
          "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
          "type": "gauge",
          "title": "Average Truck CPU (%)",
          "targets": [
            { "expr": "avg(mqtt_consumer_cpu)", "legendFormat": "avg CPU", "refId": "A" }
          ],
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 21 }
        },
        {
          "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
          "type": "gauge",
          "title": "Average System Temp (°C)",
          "targets": [
            { "expr": "avg(mqtt_consumer_tmp)", "legendFormat": "avg sys temp", "refId": "A" }
          ],
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 21 }
        },
        {
          "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
          "type": "table",
          "title": "Latest Truck Telemetry",
          "targets": [
            {
              "expr": "last_over_time(mqtt_consumer_spd[30s])",
              "legendFormat": "{{truck}} speed",
              "refId": "A"
            },
            {
              "expr": "last_over_time(mqtt_consumer_tmp[30s])",
              "legendFormat": "{{truck}} temp",
              "refId": "B"
            },
            {
              "expr": "last_over_time(mqtt_consumer_fuel[30s])",
              "legendFormat": "{{truck}} fuel",
              "refId": "C"
            }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 21 }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 41,
      "templating": {
        "list": [
          {
            "name": "region",
            "type": "query",
            "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
            "definition": "label_values(mqtt_consumer_spd,region)",
            "query": { "query": "label_values(mqtt_consumer_spd,region)" },
            "refresh": 2
          },
          {
            "name": "truck",
            "type": "query",
            "datasource": { "type": "prometheus", "name": "prometheus-user-workload" },
            "definition": "label_values(mqtt_consumer_spd{region=\"$region\"},truck)",
            "query": { "query": "label_values(mqtt_consumer_spd{region=\"$region\"},truck)" },
            "refresh": 2
          }
        ]
      },
      "time": { "from": "now-5m", "to": "now" },
      "timezone": "browser",
      "title": "Truck Telemetry Overview",
      "uid": "truck-telemetry",
      "version": 1
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: amq-broker-mqtt-fleet-overview
  namespace: grafana   # ⬅️ change if your Grafana instance is in another namespace
  labels:
    app: grafana
    dashboard: amq-broker-fleet
spec:
  instanceSelector:
    matchLabels:
      dashboards: fleet-metrics   # ⬅️ must match your Grafana instance & datasource CR
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "stat",
          "title": "Active Connections",
          "targets": [ { "expr": "sum(artemis_connection_count)", "refId": "A" } ],
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "stat",
          "title": "Active Sessions",
          "targets": [ { "expr": "sum(artemis_session_count)", "refId": "A" } ],
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "stat",
          "title": "Total Producers / Consumers",
          "targets": [
            { "expr": "sum(artemis_producer_count)", "legendFormat": "Producers", "refId": "A" },
            { "expr": "sum(artemis_consumer_count)", "legendFormat": "Consumers", "refId": "B" }
          ],
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "stat",
          "title": "Messages Currently Stored",
          "targets": [ { "expr": "sum(artemis_message_count)", "refId": "A" } ],
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Message Throughput (Enqueue / Dequeue)",
          "targets": [
            { "expr": "rate(artemis_enqueue_total[1m])", "legendFormat": "Enqueue/s", "refId": "A" },
            { "expr": "rate(artemis_dequeue_total[1m])", "legendFormat": "Dequeue/s", "refId": "B" }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 4 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Message Count Trend (Backlog Growth)",
          "targets": [
            { "expr": "artemis_message_count", "legendFormat": "{{broker}}", "refId": "A" }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 4 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Durable Message Count (Persistent Backlog)",
          "targets": [
            { "expr": "artemis_durable_message_count", "legendFormat": "{{broker}}", "refId": "A" }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 11 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Broker Resource Usage",
          "targets": [
            {
              "expr": "avg(rate(container_cpu_usage_seconds_total{pod=~\"amq-broker.*\"}[1m])) * 100",
              "legendFormat": "CPU (%)",
              "refId": "A"
            },
            {
              "expr": "avg(container_memory_usage_bytes{pod=~\"amq-broker.*\"}) / (1024^2)",
              "legendFormat": "Memory (MB)",
              "refId": "B"
            }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 11 }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 41,
      "tags": [ "amq", "artemis", "mqtt", "pilbara" ],
      "templating": {
        "list": [
          {
            "name": "site",
            "type": "query",
            "label": "Site",
            "includeAll": true,
            "multi": true,
            "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
            "definition": "label_values(artemis_address_size,broker)",
            "query": { "query": "label_values(artemis_address_size,broker)" },
            "refresh": 2,
            "current": {
              "text": [ "amq-broker" ],
              "value": [ "amq-broker" ]
            }
          }
        ]
      },
      "time": { "from": "now-1m", "to": "now" },
      "timezone": "browser",
      "title": "AMQ Broker MQTT Fleet Overview (Validated Metrics)",
      "uid": "amq-mqtt-fleet-realmetrics",
      "version": 5
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: amq-broker-mqtt-address-level
  namespace: grafana        # ← change if your Grafana instance lives elsewhere
  labels:
    app: grafana
    dashboard: amq-broker-address
spec:
  instanceSelector:
    matchLabels:
      dashboards: fleet-metrics
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 8,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "stat",
          "title": "Total Active MQTT Addresses",
          "targets": [
            { "expr": "artemis_routed_message_count{address=~\"$address\"}", "refId": "A" }
          ],
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "stat",
          "title": "Total Messages (All MQTT Topics)",
          "targets": [
            { "expr": "sum(artemis_message_count{address=~\"$address\"})", "refId": "A" }
          ],
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "stat",
          "title": "Durable Messages (Persistent MQTT)",
          "targets": [
            { "expr": "sum(artemis_durable_message_count{address=~\"$address\"})", "refId": "A" }
          ],
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Message Count per MQTT Address",
          "targets": [
            { "expr": "artemis_message_count{address=~\"$address\"}", "legendFormat": "{{address}}", "refId": "A" }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 4 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Durable Message Count per MQTT Address",
          "targets": [
            { "expr": "artemis_durable_message_count{address=~\"$address\"}", "legendFormat": "{{address}}", "refId": "A" }
          ],
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 4 }
        },
        {
          "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
          "type": "timeseries",
          "title": "Published vs Delivered (Per Address)",
          "targets": [
            { "expr": "rate(artemis_routed_message_count{address=~\"$address\"}[1m])", "legendFormat": "{{address}} Published/s", "refId": "A" },
            { "expr": "rate(artemis_address_delivered_message_count_total{address=~\"$address\"}[1m])", "legendFormat": "{{address}} Delivered/s", "refId": "B" }
          ],
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 11 }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 41,
      "tags": [ "amq", "artemis", "mqtt", "address" ],
      "templating": {
        "list": [
          {
            "name": "address",
            "label": "MQTT Address",
            "type": "query",
            "includeAll": true,
            "multi": true,
            "regex": "/mine.*/",
            "datasource": { "type": "Prometheus", "name": "prometheus-user-workload" },
            "definition": "label_values(artemis_address_size,address)",
            "query": { "query": "label_values(artemis_address_size,address)" },
            "refresh": 2
          }
        ]
      },
      "time": { "from": "now-15m", "to": "now" },
      "timezone": "browser",
      "title": "AMQ Broker MQTT Address-Level Health",
      "uid": "amq-mqtt-address-level",
      "version": 15
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: amq-broker-overview
  namespace: grafana            # change if your Grafana instance uses a different ns
  labels:
    app: amq-broker
spec:
  instanceSelector:
    matchLabels:
      dashboards: fleet-metrics   # must match your Grafana instance & datasource
  json: |
    {
      "uid": "amq-broker-overview",
      "title": "AMQ Broker 7.13 Cluster Overview",
      "tags": ["amq","artemis","mqtt","openshift"],
      "timezone": "browser",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "broker",
            "type": "query",
            "label": "Broker Pod",
            "datasource": "Prometheus",
            "query": "label_values(artemis_connection_count, pod)",
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Messages In (msg/s)",
          "targets": [
            {
              "expr": "sum(rate(artemis_messages_added[1m]))",
              "legendFormat": "Messages In",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 }
        },
        {
          "type": "stat",
          "title": "Messages Out (msg/s)",
          "targets": [
            {
              "expr": "sum(rate(artemis_messages_acknowledged[1m]))",
              "legendFormat": "Messages Out",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 }
        },
        {
          "type": "stat",
          "title": "Connections",
          "targets": [
            { "expr": "sum(artemis_connection_count)", "legendFormat": "Connections", "refId": "A" }
          ],
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 }
        },
        {
          "type": "stat",
          "title": "Sessions",
          "targets": [
            { "expr": "sum(artemis_session_count)", "legendFormat": "Sessions", "refId": "A" }
          ],
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 }
        },
        {
          "type": "stat",
          "title": "Consumers",
          "targets": [
            { "expr": "sum(artemis_consumer_count)", "legendFormat": "Consumers", "refId": "A" }
          ],
          "gridPos": { "x": 0, "y": 4, "w": 4, "h": 4 }
        },
        {
          "type": "stat",
          "title": "Estimated Producers (Sessions - Consumers)",
          "targets": [
            {
              "expr": "max(sum(artemis_session_count) - sum(artemis_consumer_count), 0)",
              "legendFormat": "Producer Sessions",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 4, "y": 4, "w": 4, "h": 4 }
        },
        {
          "type": "stat",
          "title": "Topics (Addresses, Multicast)",
          "targets": [
            {
              "expr": "count(artemis_address_size{routing_type=\"MULTICAST\"})",
              "legendFormat": "Topics",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 8, "y": 4, "w": 4, "h": 4 }
        },
        {
          "type": "stat",
          "title": "Queues",
          "targets": [
            {
              "expr": "count(artemis_queue_message_count)",
              "legendFormat": "Queues",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 12, "y": 4, "w": 4, "h": 4 }
        },
        {
          "type": "timeseries",
          "title": "Messages In / Out (per second)",
          "targets": [
            {
              "expr": "sum(rate(artemis_messages_added[1m]))",
              "legendFormat": "In",
              "refId": "A"
            },
            {
              "expr": "sum(rate(artemis_messages_acknowledged[1m]))",
              "legendFormat": "Out",
              "refId": "B"
            }
          ],
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Connections & Sessions",
          "targets": [
            { "expr": "sum(artemis_connection_count)", "legendFormat": "Connections", "refId": "A" },
            { "expr": "sum(artemis_session_count)", "legendFormat": "Sessions", "refId": "B" }
          ],
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Queue Depth (Messages per Queue)",
          "targets": [
            {
              "expr": "avg(artemis_queue_message_count)",
              "legendFormat": "Avg Msgs / Queue",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Broker Pod CPU Usage (cores)",
          "targets": [
            {
              "expr": "sum by (pod)(rate(container_cpu_usage_seconds_total{namespace=\"mqtt-broker\",container!=\"POD\",image!=\"\"}[1m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Broker Pod Memory Usage (MB)",
          "targets": [
            {
              "expr": "sum by (pod)(container_memory_usage_bytes{namespace=\"mqtt-broker\",container!=\"POD\",image!=\"\"}) / 1024 / 1024",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Dropped / Undelivered Messages (msg/s)",
          "targets": [
            {
              "expr": "rate(artemis_unrouted_message_count[1m]) + rate(artemis_expired_message_count[1m])",
              "legendFormat": "Dropped + Unrouted",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "msgs/s",
              "color": { "mode": "continuous-BlYlRd" }
            }
          }
        },
        {
          "type": "stat",
          "title": "Delivery Success %",
          "targets": [
            {
              "expr": "100 * rate(artemis_messages_acknowledged[1m]) / rate(artemis_messages_added[1m])",
              "legendFormat": "Success %",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 12, "y": 32, "w": 6, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 80 },
                  { "color": "green", "value": 95 }
                ]
              }
            }
          }
        }
      ]
    }
