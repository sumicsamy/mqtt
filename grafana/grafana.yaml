apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
spec:
  config:
    log:
      mode: console
      level: info
    auth:
      disable_login_form: false
      disable_signout_menu: false
    security:
      admin_user: admin
      admin_password: admin
  ingress:
    enabled: true
    targetPort: grafana
    termination: edge