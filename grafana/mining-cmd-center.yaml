            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: orange
                      value: 1
                    - color: red
                      value: 5
                unit: short
              overrides: []
            options:
              colorMode: background
              graphMode: none
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                  - sum
                fields: ''
                values: false
              showPercentChange: false
              textMode: auto
              wideLayout: true
