                    kind: DataQuery
                    spec:
                      editorMode: builder
                      exemplar: false
                      expr: truck_state{region="$region", truck=~"$truck"} == 1
                      format: table
                      instant: true
                      legendFormat: State
                      range: false
                    version: v0
                  refId: I
