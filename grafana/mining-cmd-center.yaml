    panel-14:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: ${datasource}
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        increase(kafka_backpressure_events_total{region="$region"}[1h])
                      legendFormat: '{{truck}}'
                      range: true
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: ''
        id: 14
        links: []
        title: Backpressure Events (1h)
        vizConfig:
          group: stat
