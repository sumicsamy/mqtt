            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: ${datasource}
                    group: prometheus
                    kind: DataQuery
                    spec:
                      expr: >-
                        histogram_quantile(0.95,
                        sum(rate(telemetry_delivery_latency_seconds_bucket{region="$region"}[5m]))
                        by (le, truck))
                      legendFormat: '{{truck}} P95'
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: ''
        id: 13
        links: []
        title: End-to-End Latency (P95)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
