apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus-user-workload
  namespace: grafana
  labels:
    grafana_datasource: '1'
spec:
  allowCrossNamespaceImport: false
  datasource:
    access: proxy
    editable: true
    isDefault: true
    jsonData:
      httpHeaderName1: Authorization
      tlsSkipVerify: true
    secureJsonData:
      httpHeaderValue1: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    type: prometheus
    url: 'https://prometheus-user-workload.openshift-user-workload-monitoring.svc.cluster.local:9091'
  instanceSelector:
    matchLabels:
      dashboards: fleet-metrics
  plugins:
    - name: grafana-clock-panel
      version: 1.3.0
  resyncPeriod: 10m0s