apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus-user-workload-fleet-metrics
  namespace: grafana
  labels:
    grafana_datasource: 'fleet-metrics'
spec:
  allowCrossNamespaceImport: true
  datasource:
    access: proxy
    editable: true
    isDefault: true
    jsonData:
      httpHeaderName1: Authorization
      tlsSkipVerify: true
    secureJsonData:
      httpHeaderValue1: "Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
    type: prometheus
    url: 'https://thanos-querier.openshift-monitoring.svc.cluster.local:9091'
  instanceSelector:
    matchLabels:
      dashboards: fleet-metrics
  plugins:
    - name: grafana-clock-panel
      version: 1.3.0
  resyncPeriod: 10m0s