apiVersion: v1
kind: Secret
metadata:
  name: fleet-manager-broker-jaas-config
  namespace: {{ .Values.brokerNamespace }}
stringData:
  login.config: |
    activemq {
      org.apache.activemq.artemis.spi.core.security.jaas.TextFileCertificateLoginModule required
          debug=true
          reload=true
          verifyDN=false
          org.apache.activemq.jaas.textfiledn.user="artemis-certs.properties"
          org.apache.activemq.jaas.textfiledn.role="artemis-roles.properties";

      org.apache.activemq.artemis.spi.core.security.jaas.PropertiesLoginModule sufficient
          debug=false
          reload=true
          org.apache.activemq.jaas.properties.user="artemis-users.properties"
          org.apache.activemq.jaas.properties.role="artemis-roles.properties";

      org.apache.activemq.artemis.spi.core.security.jaas.GuestLoginModule optional
          debug=false
          org.apache.activemq.jaas.guest.user="admin"
          org.apache.activemq.jaas.guest.role="admin";
    };
    console {
      org.apache.activemq.artemis.spi.core.security.jaas.PropertiesLoginModule sufficient
          debug=false
          reload=true
          org.apache.activemq.jaas.properties.user="artemis-users.properties"
          org.apache.activemq.jaas.properties.role="artemis-roles.properties";

      org.apache.activemq.artemis.spi.core.security.jaas.GuestLoginModule optional
          debug=false
          org.apache.activemq.jaas.guest.user="admin"
          org.apache.activemq.jaas.guest.role="admin";
    };

  artemis-certs.properties: |
    {{- range $site := .Values.sites }}
    {{- range $i, $_ := until ($site.truckCount | int) }}
    truck-{{ $site.id }}-{{ printf "%03d" $i }}=CN=truck-{{ $site.id }}-{{ printf "%03d" $i }}
    {{- end }}
    {{- end }}
    telegraf=CN=telegraf.fleet-metrics.svc.cluster.local

  artemis-roles.properties: |
    {{- range $site := .Values.sites }}
    {{- range $i, $_ := until ($site.truckCount | int) }}
    truck-{{ $site.id }}-{{ printf "%03d" $i }}=truck-{{ $site.id }}-{{ printf "%03d" $i }}
    {{- end }}
    {{- end }}
    telegraf=telegraf

  artemis-users.properties: |
    admin = ENC(1024:1364168BD4F642AA4B4668819AF5304E4FD0B3C928167459171A8415F71FB348:64EF71C3A34F7A9BB6F26FC5FDF939F5F2B0F2585967D89DD201321923876B9B01C8A86E2A7E6390E006F0C343F9234411901419C53F58A90C5343C238F53A3A)