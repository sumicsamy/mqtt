apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fleet-simulator
  namespace: openshift-gitops
spec:
  description: Project to manage all fleet truck simulator Applications
  sourceRepos:
    - 'https://github.com/sumicsamy/mqtt.git'
  destinations:
    - namespace: '*'
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
