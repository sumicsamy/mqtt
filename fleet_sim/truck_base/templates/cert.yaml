apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: truck-{{ .Values.siteId }}-{{ .Values.truckId }}-tls
  namespace: {{ .Values.namespace }}
spec:
  secretName: truck-{{ .Values.siteId }}-{{ .Values.truckId }}-tls
  commonName: truck-{{ .Values.siteId }}-{{ .Values.truckId }}
  usages: ["client auth"]
  issuerRef:
    name: "{{ .Values.namespace }}-issuer"
    kind: Issuer
